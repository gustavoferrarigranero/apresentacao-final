server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;

    # Encaminha rotas dinâmicas para Laravel e entrega assets compilados diretamente pelo Nginx.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Os uploads persistem no volume partilhado da aplicação sem depender de symlinks no host.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        autoindex off;
    }

    # O PHP só é executado no contentor FPM da aplicação, nunca no contentor Nginx.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # Não expõe ficheiros ocultos nem configurações do repositório através do servidor web.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
